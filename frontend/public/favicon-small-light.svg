<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Event monitoring assistant icon (light, small)</title>
  <!-- 小さい表示（ヘッダー・タブ）向けに要素を減らして太くした簡易版 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e9ee"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4f57"/>
      <stop offset="0.46" stop-color="#6b7079"/>
      <stop offset="0.52" stop-color="#ff9a3c"/>
      <stop offset="0.78" stop-color="#d9752f"/>
      <stop offset="1" stop-color="#a8897a"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect x="4" y="4" width="504" height="504" rx="104" fill="url(#bg)" stroke="#d3d7de" stroke-width="2"/>

  <!-- Circular status ring (thick) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ring)" stroke-width="58"/>
  <path d="M 349 90 A 190 190 0 0 1 438 205" fill="none" stroke="#f1f3f6" stroke-width="60"/>

  <!-- Event graph (few, bold points) -->
  <path d="M132 292 L206 220 L272 280 L356 172" fill="none" stroke="#2b2f36" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2b2f36">
    <circle cx="206" cy="220" r="28"/>
    <circle cx="272" cy="280" r="28"/>
    <circle cx="356" cy="172" r="28"/>
  </g>

  <!-- Warning triangle (large, separated from the ring) -->
  <path d="M352 286 L448 446 H256 Z" fill="#eaedf1" stroke="#eaedf1" stroke-width="64" stroke-linejoin="round"/>
  <path d="M352 286 L448 446 H256 Z" fill="#f0443e" stroke="#f0443e" stroke-width="30" stroke-linejoin="round"/>
  <rect x="339" y="328" width="26" height="72" rx="13" fill="#fff"/>
  <circle cx="352" cy="426" r="15" fill="#fff"/>
</svg>
