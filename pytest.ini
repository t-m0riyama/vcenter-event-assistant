[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# plugin-api は tests/conftest.py（DB とアプリのブートストラップ）に依存しない場所に置く。
# アプリなしで使えることを、テストの置き場所で担保している。
testpaths = tests packages/plugin-api/tests
# ダイジェスト関連は負荷が高いため既定では除外。全件は `pytest -m ""` または `pytest --override-ini addopts=`
addopts = -m "not digest_heavy"
markers =
    digest_heavy: ダイジェスト関連の高負荷テスト（再実行は pytest -m digest_heavy）
