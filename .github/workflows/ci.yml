name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ドキュメントだけの変更（計画書の更新など）では、後続のジョブを省く（Issue #262）。
  # on.paths は pull_request では PR 全体の差分で判定するため、コードを含む PR に後から
  # ドキュメントだけのコミットを push しても省けない。ここではその push で増えたコミットだけを見る。
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # 前の先頭の CI の結果を読む
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # push の前の先頭を起点にできるか。祖先で、かつその先頭の CI が成功していること
          # （失敗・中断・実行中のコードの後にドキュメントだけを push して、未検証のまま省かないため）
          verified_before() {
            git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null || return 1
            [ "$(gh run list --workflow ci.yml --commit "$BEFORE" --status success --json databaseId --jq length)" != 0 ]
          }
          # 比べる起点。PR への追加の push はその push の前の先頭、それ以外の PR は main との分岐点、
          # main への push は push の前の先頭。前の先頭を起点にできず、決められないときは全部走らせる
          from=""
          if [ "$EVENT" = pull_request ] && [ "$ACTION" = synchronize ] && verified_before; then
            from="$BEFORE"
          elif [ "$EVENT" = pull_request ]; then
            from="$(git merge-base "$BASE" "$AFTER" 2>/dev/null)" || from=""
          elif verified_before; then
            from="$BEFORE"
          fi
          if [ -z "$from" ]; then
            echo "変更の範囲を決められないので、すべて走らせる"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 改名は削除と追加として扱う（参照されている元のパスを見落とさないため）。
          # 差分を取れなければ、省かずに全部走らせる
          if ! files="$(git diff --name-only --no-renames "$from" "$AFTER")"; then
            echo "差分を取れないので、すべて走らせる"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r file; do
            case "$file" in
              "") ;;
              # テストやビルドが読む Markdown は対象に戻す:
              # - docs/user-guides/: 利用者向けガイド（ヘルプのリンク先）
              # - README.md: パッケージのメタデータ（pyproject.toml の readme）として読まれる
              docs/user-guides/* | README.md | packages/*/README.md) code=true ;;
              # ヘルプが参照するドキュメント（docs/backend.md など）は、tabHelpContent.test.ts が
              # 存在と見出しを確かめるので走らせる。参照先はファイル名を並べず、ヘルプの定義から引く
              docs/* | *.md)
                if grep -qF -e "'$file'" -e "\"$file\"" frontend/src/help/tabHelpContent.ts; then code=true; fi ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "変更の範囲: $from..$AFTER → code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"
      - name: Sync Python dependencies
        run: uv sync --all-groups
      - name: Ruff
        run: uv run ruff check src packages/plugin-api/src packages/plugin-api/tests tests examples
      - name: Mypy
        run: uv run mypy
      - name: Python tests
        run: uv run pytest -n 2 --dist loadfile --durations=30

      # plugin-api は第三者が単体で pip install する公開パッケージである。
      # 「依存ゼロ」「アプリなしで import できる」は口約束にせず毎 PR で確かめる。
      - name: Build and verify the plugin API package
        run: |
          set -euo pipefail
          rm -rf dist/plugin-api-ci
          uv build --package vcenter-event-assistant-plugin-api --out-dir dist/plugin-api-ci
          wheel="$(ls dist/plugin-api-ci/*.whl)"
          echo "built: ${wheel}"

          # 型情報を配布していること。
          unzip -l "${wheel}" | grep -q 'vcenter_event_assistant_plugin_api/py.typed'

          # テストハーネスを同梱していること（作者が pip install だけで使える）。
          unzip -l "${wheel}" | grep -q 'vcenter_event_assistant_plugin_api/testing/__init__.py'
          unzip -l "${wheel}" | grep -q 'vcenter_event_assistant_plugin_api/testing/fixtures.py'

          # アプリのプロジェクトから切り離した環境で import できること
          # （= 必須依存が本当に無い）。同時に pyVmomi を引かないこと。
          uv run --isolated --no-project --with "${wheel}" python - <<'EOF'
          import sys
          from importlib import metadata

          import vcenter_event_assistant_plugin_api as api

          required = [
              r
              for r in (metadata.requires("vcenter-event-assistant-plugin-api") or [])
              if "extra ==" not in r
          ]
          assert required == [], f"unexpected runtime dependencies: {required}"
          assert api.PLUGIN_API_VERSION == 1, api.PLUGIN_API_VERSION
          leaked = sorted(m for m in sys.modules if m.split(".")[0] in {"pyVmomi", "pyVim"})
          assert leaked == [], f"pyVmomi must stay lazily imported, got {leaked}"

          # テストハーネスは pytest 抜きで import できること。pytest の fixture は
          # `testing.fixtures` に隔離され、pytest11 としては登録されていないこと。
          import vcenter_event_assistant_plugin_api.testing as harness

          pytest_loaded = sorted(m for m in sys.modules if m.split(".")[0] == "pytest")
          assert pytest_loaded == [], f"the harness must not require pytest, got {pytest_loaded}"
          assert harness.run_collect is not None
          plugins = [
              ep.value
              for ep in metadata.entry_points(group="pytest11")
              if "vcenter_event_assistant_plugin_api" in ep.value
          ]
          assert plugins == [], f"pytest11 must stay unregistered, got {plugins}"
          print("plugin-api", api.__version__, "verified standalone")
          EOF

          # スキャフォールドの生成物が、plugin-api だけを入れた環境で pytest を通ること。
          # 「アプリを起動せずにテストできる」は作者体験の中心なので、実環境で確かめる。
          rm -rf dist/scaffold-ci
          wheel_abs="$(cd "$(dirname "${wheel}")" && pwd)/$(basename "${wheel}")"
          uv run --isolated --no-project \
            --with "${wheel}" \
            python -m vcenter_event_assistant_plugin_api.scaffold \
              my-sensor-collector --kind metric --out dist/scaffold-ci/metric
          uv run --isolated --no-project \
            --with "${wheel}" \
            python -m vcenter_event_assistant_plugin_api.scaffold \
              acme-event-collector --kind event --out dist/scaffold-ci/event
          for kind in metric event; do
            (
              cd "dist/scaffold-ci/${kind}"
              PYTHONPATH=src uv run --isolated --no-project \
                --with "${wheel_abs}[vmware]" \
                --with pytest --with pytest-asyncio \
                pytest -q -p no:cacheprovider tests
            )
          done

  frontend-unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' || steps.changes.outputs.frontend == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Unit tests
        if: github.event_name == 'push' || steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci && npm run test

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            e2e:
              - 'frontend/**'
              - 'src/**'
              - 'packages/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
      - uses: astral-sh/setup-uv@v5
        if: github.event_name == 'push' || steps.changes.outputs.e2e == 'true'
        with:
          version: "0.8.15"
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' || steps.changes.outputs.e2e == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Sync Python deps
        if: github.event_name == 'push' || steps.changes.outputs.e2e == 'true'
        run: uv sync --all-groups
      - name: Install frontend deps and Playwright Chromium
        if: github.event_name == 'push' || steps.changes.outputs.e2e == 'true'
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E
        if: github.event_name == 'push' || steps.changes.outputs.e2e == 'true'
        working-directory: frontend
        env:
          CI: "true"
        run: npm run e2e
