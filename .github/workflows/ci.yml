name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"
      - name: Sync and test
        run: |
          uv sync --all-groups
          uv run ruff check src packages/plugin-api/src tests examples
          uv run mypy
          uv run pytest --cov=vcenter_event_assistant --cov-report=xml --cov-report=html

      # plugin-api は第三者が単体で pip install する公開パッケージである。
      # 「依存ゼロ」「アプリなしで import できる」は口約束にせず毎 PR で確かめる。
      - name: Build and verify the plugin API package
        run: |
          set -euo pipefail
          rm -rf dist/plugin-api-ci
          uv build --package vcenter-event-assistant-plugin-api --out-dir dist/plugin-api-ci
          wheel="$(ls dist/plugin-api-ci/*.whl)"
          echo "built: ${wheel}"

          # 型情報を配布していること。
          unzip -l "${wheel}" | grep -q 'vcenter_event_assistant_plugin_api/py.typed'

          # アプリのプロジェクトから切り離した環境で import できること
          # （= 必須依存が本当に無い）。同時に pyVmomi を引かないこと。
          uv run --isolated --no-project --with "${wheel}" python - <<'EOF'
          import sys
          from importlib import metadata

          import vcenter_event_assistant_plugin_api as api

          required = [
              r
              for r in (metadata.requires("vcenter-event-assistant-plugin-api") or [])
              if "extra ==" not in r
          ]
          assert required == [], f"unexpected runtime dependencies: {required}"
          assert api.PLUGIN_API_VERSION == 1, api.PLUGIN_API_VERSION
          leaked = sorted(m for m in sys.modules if m.split(".")[0] in {"pyVmomi", "pyVim"})
          assert leaked == [], f"pyVmomi must stay lazily imported, got {leaked}"
          print("plugin-api", api.__version__, "verified standalone")
          EOF
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            htmlcov/index.html
          if-no-files-found: error

  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' || steps.changes.outputs.frontend == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Unit tests and coverage
        if: github.event_name == 'push' || steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci && npm run test:coverage
      - name: Upload coverage reports
        if: github.event_name == 'push' || steps.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/coverage-summary.json
            frontend/coverage/index.html
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            e2e:
              - 'frontend/**'
              - 'src/**'
              - 'packages/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
      - uses: astral-sh/setup-uv@v5
        if: github.event_name == 'push' || steps.changes.outputs.e2e == 'true'
        with:
          version: "0.8.15"
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' || steps.changes.outputs.e2e == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Sync Python deps
        if: github.event_name == 'push' || steps.changes.outputs.e2e == 'true'
        run: uv sync --all-groups
      - name: Install frontend deps and Playwright Chromium
        if: github.event_name == 'push' || steps.changes.outputs.e2e == 'true'
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E
        if: github.event_name == 'push' || steps.changes.outputs.e2e == 'true'
        working-directory: frontend
        env:
          CI: "true"
        run: npm run e2e
