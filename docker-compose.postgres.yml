services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: vcenter_event_assistant
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vea -d vcenter_event_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vea:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/vcenter_event_assistant
      # 本番では .env の VEA_SECRET_KEY で vCenter パスワードを DB 暗号化（未設定時は平文 + 起動 WARNING）
      # 生成例: openssl rand -base64 32
      APP_LOG_FILE: /var/log/vea/app.log
      UVICORN_LOG_FILE: /var/log/vea/uvicorn.log
      # 動的インストールしたプラグインの配置先（read_only の rootfs 外に置く必要がある）
      VEA_PLUGIN_DIR: /data/plugins
      # uv のキャッシュも書き込み可能な場所へ（tmpfs の /tmp）
      UV_CACHE_DIR: /tmp/uv-cache
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - vea_logs:/var/log/vea
      - vea_data:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  vea_logs:
  vea_data:
